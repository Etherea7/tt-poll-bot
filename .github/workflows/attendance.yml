name: Attendance collection

# Collects Telegram poll votes and keeps each month's roster message current.
#
# Hourly rather than continuous: Telegram keeps unconsumed updates for 24 hours,
# so this has roughly 24x margin, and a roster does not need to be fresher than
# an hour. There is no preview mode because the job only reads updates and edits
# an existing message — it can never post something new to a group.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Two concurrent `getUpdates` consumers receive HTTP 409 from Telegram, so this
# workflow must never overlap with itself. Queue, never cancel: a cancelled run
# could be interrupted between applying a page and pushing it.
concurrency:
  group: attendance
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # npm lifecycle scripts never receive a persisted Git write credential.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Collect attendance updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DESTINATIONS: ${{ vars.TELEGRAM_DESTINATIONS }}
        run: |
          set -euo pipefail
          node src/collect-main.ts

      # Always: the collection run saves each page before the next request, so
      # a failed run still has durable work to persist. Losing it would lose
      # votes permanently once Telegram's 24-hour retention expires.
      - name: Push attendance state
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain state/ 2>/dev/null)" ]; then
            echo 'no attendance change to persist'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/
          git commit -m 'chore(state): record attendance [skip ci]'
          basic_auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          auth_key='http.https://github.com/.extraheader'
          git config "$auth_key" "AUTHORIZATION: basic $basic_auth"
          trap 'git config --unset-all "$auth_key" || true' EXIT
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
