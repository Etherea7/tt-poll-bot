name: Monthly polls

# Runs on the 25th for the following month. Manual dispatch is preview-only by
# default; a scheduled or explicitly live dispatch uses a two-phase state claim.
on:
  schedule:
    - cron: '17 9 25 * *'
      timezone: Asia/Singapore
  workflow_dispatch:
    inputs:
      month:
        description: 'Target month (YYYY-MM). Blank derives the following month.'
        required: false
        type: string
      preview:
        description: 'Render without contacting Telegram'
        required: false
        type: boolean
        default: true
      only:
        description: 'Comma-separated subset: fridays,saturdays,sundays,holidays'
        required: false
        type: string
      to:
        description: 'Comma-separated destination aliases. Blank means all.'
        required: false
        type: string
      force:
        description: 'Explicitly replace existing delivery state during prepare'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Shared with the attendance collection workflow on purpose: both write
# state/ and push it, and collection that runs between poll delivery and the
# registration push would treat those polls' first votes as unregistered and
# advance past them, discarding them permanently.
concurrency:
  group: telegram-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # npm lifecycle scripts never receive a persisted Git write credential.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Preview polls
        if: github.event_name == 'workflow_dispatch' && inputs.preview
        env:
          TELEGRAM_DESTINATIONS: ${{ vars.TELEGRAM_DESTINATIONS }}
          INPUT_MONTH: ${{ inputs.month }}
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_TO: ${{ inputs.to }}
        run: |
          set -euo pipefail
          args=(--preview)
          if [ -n "${INPUT_MONTH:-}" ]; then args+=(--month "$INPUT_MONTH"); fi
          if [ -n "${INPUT_ONLY:-}" ]; then args+=(--only "$INPUT_ONLY"); fi
          if [ -n "${INPUT_TO:-}" ]; then args+=(--to "$INPUT_TO"); fi
          node src/main.ts "${args[@]}"

      # A unique claim separates this workflow attempt from any stale claim
      # left by cancellation, an ambiguous Telegram response, or a failed push.
      - name: Prepare durable delivery claims
        if: github.event_name == 'schedule' || !inputs.preview
        env:
          TELEGRAM_DESTINATIONS: ${{ vars.TELEGRAM_DESTINATIONS }}
          CLAIM_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          INPUT_MONTH: ${{ inputs.month }}
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_TO: ${{ inputs.to }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=(--prepare --claim "$CLAIM_ID")
          if [ -n "${INPUT_MONTH:-}" ]; then args+=(--month "$INPUT_MONTH"); fi
          if [ -n "${INPUT_ONLY:-}" ]; then args+=(--only "$INPUT_ONLY"); fi
          if [ -n "${INPUT_TO:-}" ]; then args+=(--to "$INPUT_TO"); fi
          if [ "${INPUT_FORCE:-}" = "true" ]; then args+=(--force); fi
          node src/main.ts "${args[@]}"

      - name: Push prepared delivery claims
        if: github.event_name == 'schedule' || !inputs.preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain state/ 2>/dev/null)" ]; then
            echo 'no new delivery claims to persist'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/
          git commit -m 'chore(state): claim monthly polls [skip ci]'
          basic_auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          auth_key='http.https://github.com/.extraheader'
          git config "$auth_key" "AUTHORIZATION: basic $basic_auth"
          trap 'git config --unset-all "$auth_key" || true' EXIT
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # Reaching this step proves the remote claim exists. A stale or different
      # claim ID is rejected by the CLI before any Telegram request.
      - name: Send claimed polls
        id: live
        if: github.event_name == 'schedule' || !inputs.preview
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DESTINATIONS: ${{ vars.TELEGRAM_DESTINATIONS }}
          CLAIM_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          INPUT_MONTH: ${{ inputs.month }}
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_TO: ${{ inputs.to }}
        run: |
          set -euo pipefail
          args=(--live --claim "$CLAIM_ID")
          if [ -n "${INPUT_MONTH:-}" ]; then args+=(--month "$INPUT_MONTH"); fi
          if [ -n "${INPUT_ONLY:-}" ]; then args+=(--only "$INPUT_ONLY"); fi
          if [ -n "${INPUT_TO:-}" ]; then args+=(--to "$INPUT_TO"); fi
          node src/main.ts "${args[@]}"

      # Always try to publish exact per-destination successes. If this push
      # fails, the already-pushed claims remain and block an automatic resend.
      - name: Push delivered state
        if: always() && (github.event_name == 'schedule' || !inputs.preview)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain state/ 2>/dev/null)" ]; then
            echo 'no delivered-state change to persist'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/
          git commit -m 'chore(state): record delivered polls [skip ci]'
          basic_auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          auth_key='http.https://github.com/.extraheader'
          git config "$auth_key" "AUTHORIZATION: basic $basic_auth"
          trap 'git config --unset-all "$auth_key" || true' EXIT
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
